<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Duan Duan"><link rel="apple-touch-icon" sizes="180x180" href="./duanduanlogo.png?v=2"><link rel="icon" type="image/png" href="./duanduanlogo.png?v=2"><title>Duan Duan · UK Life Test</title>
<style>
:root{color-scheme:dark;--bg:#111827;--card:#253047;--lime:#c4f45d;--muted:#c3cad8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7fb;font:16px/1.55 system-ui,-apple-system,Arial}main{max-width:560px;margin:auto;padding:20px 18px 48px}h1{font-size:25px;margin:8px 0}h2{font-size:20px;margin:8px 0 12px}h3{font-size:17px;margin:8px 0}.card{background:var(--card);border-radius:18px;padding:19px;margin:15px 0}.muted{color:var(--muted)}.tag{color:var(--lime);font-weight:700}.small{font-size:13px}.hidden{display:none!important}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 14px}button:focus-visible{outline:3px solid white;outline-offset:2px}.primary{background:var(--lime);color:#111827;font-weight:700}.secondary{background:#394860;color:white}.full{display:block;width:100%;text-align:left;margin:9px 0}.row{display:flex;align-items:center;gap:8px}.row .grow{flex:1;min-width:0}.speak{background:#394860;color:white;min-width:45px;padding:10px}.lesson{width:100%;text-align:left;background:#34435c;color:white;margin:7px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.lesson.active{outline:2px solid var(--lime)}.lesson strong{display:block}.lesson small{color:var(--muted)}.choice{background:#d6f7a1;color:#111827;text-align:left;flex:1;min-width:0}.choice:disabled{opacity:.65}.choice.correct{background:#9fe7b6;opacity:1}.choice.wrong{background:#f2adad;opacity:1}.answer-row{display:flex;gap:7px;margin:8px 0}.feedback{font-weight:600;min-height:20px}.word{border-bottom:1px dotted var(--lime);cursor:pointer}progress{width:100%;height:15px;accent-color:var(--lime)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat{background:#34435c;border-radius:12px;padding:10px 5px}.stat strong{font-size:22px;color:var(--lime);display:block}.stat span{font-size:12px;color:var(--muted)}.nav{display:flex;gap:8px}.nav button{flex:1;text-align:center}.explain p{margin:10px 0}button:disabled{cursor:default}
</style></head><body><main>
<header><h1>🇬🇧 Duan Duan · 英国生活考试</h1><p class="muted">每天五分钟 · 中文理解 · 英文练习</p></header>
<section class="card" aria-label="学习进度"><div class="tag">我的学习进度</div><div class="stats" style="margin:12px 0"><div class="stat"><strong id="completed">0/2</strong><span>完成课程</span></div><div class="stat"><strong id="answered">0</strong><span>回答次数</span></div><div class="stat"><strong id="accuracy">—</strong><span>答题正确率</span></div></div><progress id="overall" value="0" max="2"></progress><p class="muted small" id="progress-note"></p></section>
<section class="card"><div class="tag">选择课程</div><div id="lesson-list"></div></section>
<section class="card explain" id="lesson-card"><div class="tag" id="lesson-label"></div><h2 id="lesson-title"></h2><div id="lesson-explanation"></div><button type="button" id="start" class="primary full">开始练习 →</button></section>
<section class="card hidden" id="quiz-card"><div class="row"><div class="tag grow" id="counter"></div><button class="secondary" id="back" type="button">返回课程</button></div><h2 id="question"></h2><button class="speak" id="say-question" type="button">🔊 听题目</button><p class="muted small">点击 🔊 听英文发音。</p><div id="choices"></div><p id="feedback" class="feedback" aria-live="polite"></p><button id="next" class="primary full hidden" type="button">下一题 →</button></section>
<section class="card"><h3>学习记录</h3><div id="lesson-stats"></div><p class="muted small">进度仅保存在这台设备的当前网站数据中，不会跨设备同步。清除网站数据可能丢失记录。</p><button class="secondary full" id="reset-current" type="button">重新练习当前课程</button></section>
<p class="muted small">这是学习原型，题目为练习题，并非官方真题。正式备考请以最新版官方《Life in the United Kingdom》学习手册为准。</p>
</main><script>
'use strict';
const lessons=[
{id:'uk',title:'英国由哪些部分组成？',en:'What is the UK?',html:`<p>英国的正式名称是 <b>United Kingdom of Great Britain and Northern Ireland</b>（大不列颠及北爱尔兰联合王国）。</p><p>英国由四个组成部分构成：<b>England 英格兰、Scotland 苏格兰、Wales 威尔士、Northern Ireland 北爱尔兰</b>。</p><p><b>Great Britain</b>（大不列颠）指英格兰、苏格兰和威尔士所在的岛屿，不包括北爱尔兰。</p>`,questions:[
{q:'How many countries make up the United Kingdom?',a:['Three','Four','Five','Six'],k:1,why:'英国由四个组成部分构成：英格兰、苏格兰、威尔士和北爱尔兰。'},
{q:'Which of these is NOT part of the United Kingdom?',a:['Wales','Scotland','Republic of Ireland','Northern Ireland'],k:2,why:'爱尔兰共和国是独立国家；北爱尔兰属于英国。'},
{q:'Which three countries are on the island of Great Britain?',a:['England, Scotland and Wales','England, Wales and Northern Ireland','Scotland, Wales and Ireland','England, Scotland and Northern Ireland'],k:0,why:'大不列颠岛包括英格兰、苏格兰和威尔士。'},
{q:'What is the full name of the UK?',a:['The Republic of Great Britain','The United Kingdom of England and Wales','The United Kingdom of Great Britain and Northern Ireland','The British Commonwealth'],k:2,why:'英国全称是 The United Kingdom of Great Britain and Northern Ireland。'}]},
{id:'capitals',title:'四个组成部分的首府',en:'The Four Nations and Their Capitals',html:`<p>英国四个组成部分各有一个首府（<b>capital city</b>）。这四组对应关系要记住：</p><p>🏴 <b>England → London</b>（伦敦）</p><p>🏴 <b>Scotland → Edinburgh</b>（爱丁堡）</p><p>🏴 <b>Wales → Cardiff</b>（加的夫）</p><p>🇬🇧 <b>Northern Ireland → Belfast</b>（贝尔法斯特）</p><p><b>容易混淆：</b>London 既是英格兰的首府，也是整个英国的首都。Edinburgh 是苏格兰首府，不是 Glasgow。</p>`,questions:[
{q:'What is the capital city of Scotland?',a:['Glasgow','Edinburgh','Cardiff','Belfast'],k:1,why:'苏格兰的首府是 Edinburgh（爱丁堡），不是 Glasgow。'},
{q:'Which country has Cardiff as its capital?',a:['Wales','England','Scotland','Northern Ireland'],k:0,why:'Cardiff（加的夫）是 Wales（威尔士）的首府。'},
{q:'What is the capital city of Northern Ireland?',a:['Dublin','London','Belfast','Edinburgh'],k:2,why:'Northern Ireland（北爱尔兰）的首府是 Belfast（贝尔法斯特）；Dublin 是爱尔兰共和国的首都。'},
{q:'Which city is the capital of both England and the United Kingdom?',a:['Manchester','Cardiff','Birmingham','London'],k:3,why:'London（伦敦）既是英格兰首府，也是英国首都。'},
{q:'Which pairing is correct?',a:['Scotland — Cardiff','Wales — Belfast','Northern Ireland — Belfast','England — Edinburgh'],k:2,why:'正确对应：Northern Ireland — Belfast。'}]}
];
const storeKey='duanduan_progress_v2',oldKey='uk_litr_demo_v1';
function empty(){return {selected:'uk',records:{uk:{i:0,attempts:[]},capitals:{i:0,attempts:[]}}}}
let state=empty();
try{const v=JSON.parse(localStorage.getItem(storeKey));if(v&&v.records)state=v;else{const old=JSON.parse(localStorage.getItem(oldKey));if(old){state.records.uk.i=Math.max(0,Math.min(4,Number(old.i)||0));state.records.uk.attempts=Array.isArray(old.attempts)?old.attempts:[];}}}catch(e){}
function record(id){if(!state.records[id])state.records[id]={i:0,attempts:[]};return state.records[id]}
function save(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}}
let inQuiz=false,answeredThisQuestion=false;
function speak(t){if(!('speechSynthesis' in window)){alert('此浏览器不支持语音朗读。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.83;const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase()==='en-gb');if(v)u.voice=v;speechSynthesis.speak(u)}
function lesson(){return lessons.find(x=>x.id===state.selected)||lessons[0]}
function updateDashboard(){const finished=lessons.filter(l=>record(l.id).i>=l.questions.length).length,attempts=lessons.flatMap(l=>record(l.id).attempts),correct=attempts.filter(a=>a.correct).length;document.getElementById('completed').textContent=finished+'/'+lessons.length;document.getElementById('answered').textContent=attempts.length;document.getElementById('accuracy').textContent=attempts.length?Math.round(100*correct/attempts.length)+'%':'—';document.getElementById('overall').value=finished;document.getElementById('progress-note').textContent=finished===lessons.length?'两课均已完成，可以随时复习。':'已完成 '+finished+' 课，共 '+lessons.length+' 课。';const list=document.getElementById('lesson-list');list.replaceChildren();for(const l of lessons){const r=record(l.id),b=document.createElement('button');b.type='button';b.className='lesson'+(state.selected===l.id?' active':'');const left=document.createElement('span');const title=document.createElement('strong');title.textContent='第 '+(lessons.indexOf(l)+1)+' 课 · '+l.title;const sub=document.createElement('small');sub.textContent=l.en;left.append(title,sub);const right=document.createElement('span');right.textContent=r.i>=l.questions.length?'✓ 完成':r.i+'/'+l.questions.length;b.append(left,right);b.onclick=()=>{state.selected=l.id;inQuiz=false;save();render()};list.appendChild(b)}const history=document.getElementById('lesson-stats');history.replaceChildren();for(const l of lessons){const r=record(l.id),p=document.createElement('p');p.textContent='第 '+(lessons.indexOf(l)+1)+' 课：'+Math.min(r.i,l.questions.length)+'/'+l.questions.length+' 题完成 · '+r.attempts.filter(a=>a.correct).length+'/'+r.attempts.length+' 次答对';history.appendChild(p)}}
function render(){const l=lesson(),r=record(l.id);updateDashboard();document.getElementById('lesson-label').textContent='第 '+(lessons.indexOf(l)+1)+' 课 · '+l.en;document.getElementById('lesson-title').textContent=l.title;document.getElementById('lesson-explanation').innerHTML=l.html;document.getElementById('start').textContent=r.i>=l.questions.length?'重新复习本课 →':r.i?'继续练习 →':'开始练习 →';document.getElementById('lesson-card').classList.toggle('hidden',inQuiz);document.getElementById('quiz-card').classList.toggle('hidden',!inQuiz);if(inQuiz)renderQuestion()}
function renderQuestion(){const l=lesson(),r=record(l.id),done=r.i>=l.questions.length,choices=document.getElementById('choices');choices.replaceChildren();document.getElementById('feedback').textContent='';document.getElementById('next').classList.add('hidden');answeredThisQuestion=false;document.getElementById('counter').textContent=done?'本课完成':'第 '+(lessons.indexOf(l)+1)+' 课 · 问题 '+(r.i+1)+' / '+l.questions.length;document.getElementById('say-question').classList.toggle('hidden',done);if(done){document.getElementById('question').textContent='✓ 本课完成！';document.getElementById('feedback').textContent='你已完成本课 '+l.questions.length+' 道题。可以返回课程选择下一课。';return}const q=l.questions[r.i];document.getElementById('question').textContent=q.q;q.a.forEach((a,j)=>{const row=document.createElement('div');row.className='answer-row';const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+a;b.onclick=()=>{if(answeredThisQuestion)return;answeredThisQuestion=true;const ok=j===q.k;r.attempts.push({question:r.i,answer:j,correct:ok,time:new Date().toISOString()});save();choices.querySelectorAll('.choice').forEach((x,idx)=>{x.disabled=true;if(idx===q.k)x.classList.add('correct');else if(idx===j)x.classList.add('wrong')});document.getElementById('feedback').textContent=(ok?'✓ 答对了。':'✗ 这次没答对。')+q.why;document.getElementById('next').classList.remove('hidden');updateDashboard()};const audio=document.createElement('button');audio.type='button';audio.className='speak';audio.textContent='🔊';audio.setAttribute('aria-label','朗读 '+a);audio.onclick=()=>speak(a);row.append(b,audio);choices.appendChild(row)})}
document.getElementById('say-question').onclick=()=>{const l=lesson(),r=record(l.id);if(r.i<l.questions.length)speak(l.questions[r.i].q)};
document.getElementById('start').onclick=()=>{const l=lesson(),r=record(l.id);if(r.i>=l.questions.length){r.i=0;save()}inQuiz=true;render()};
document.getElementById('back').onclick=()=>{inQuiz=false;render()};
document.getElementById('next').onclick=()=>{if(!answeredThisQuestion)return;const r=record(lesson().id);r.i++;save();render()};
document.getElementById('reset-current').onclick=()=>{if(!confirm('重新开始本课？本课之前的答题记录也会清除。'))return;state.records[lesson().id]={i:0,attempts:[]};inQuiz=false;save();render()};
render();
</script></body></html>
