</main><script>
'use strict';
const lessons=[
{id:'uk',title:'英国由哪些部分组成？',en:'What is the UK?',html:`<p>英国的正式名称是 <b>United Kingdom of Great Britain and Northern Ireland</b>（大不列颠及北爱尔兰联合王国）。</p><p>英国由四个组成部分构成：<b>England 英格兰、Scotland 苏格兰、Wales 威尔士、Northern Ireland 北爱尔兰</b>。</p><p><b>Great Britain</b>（大不列颠）指英格兰、苏格兰和威尔士所在的岛屿，不包括北爱尔兰。</p>`,questions:[
{q:'How many countries make up the United Kingdom?',a:['Three','Four','Five','Six'],k:1,why:'英国由四个组成部分构成：英格兰、苏格兰、威尔士和北爱尔兰。'},
{q:'Which of these is NOT part of the United Kingdom?',a:['Wales','Scotland','Republic of Ireland','Northern Ireland'],k:2,why:'爱尔兰共和国是独立国家；北爱尔兰属于英国。'},
{q:'Which three countries are on the island of Great Britain?',a:['England, Scotland and Wales','England, Wales and Northern Ireland','Scotland, Wales and Ireland','England, Scotland and Northern Ireland'],k:0,why:'大不列颠岛包括英格兰、苏格兰和威尔士。'},
{q:'What is the full name of the UK?',a:['The Republic of Great Britain','The United Kingdom of England and Wales','The United Kingdom of Great Britain and Northern Ireland','The British Commonwealth'],k:2,why:'英国全称是 The United Kingdom of Great Britain and Northern Ireland。'}]},
{id:'capitals',title:'四个组成部分的首府',en:'The Four Nations and Their Capitals',html:`<p>英国四个组成部分各有一个首府（<b>capital city</b>）。这四组对应关系要记住：</p><p>🏴 <b>England → London</b>（伦敦）</p><p>🏴 <b>Scotland → Edinburgh</b>（爱丁堡）</p><p>🏴 <b>Wales → Cardiff</b>（加的夫）</p><p>🇬🇧 <b>Northern Ireland → Belfast</b>（贝尔法斯特）</p><p><b>容易混淆：</b>London 既是英格兰的首府，也是整个英国的首都。Edinburgh 是苏格兰首府，不是 Glasgow。</p>`,questions:[
{q:'What is the capital city of Scotland?',a:['Glasgow','Edinburgh','Cardiff','Belfast'],k:1,why:'苏格兰的首府是 Edinburgh（爱丁堡），不是 Glasgow。'},
{q:'Which country has Cardiff as its capital?',a:['Wales','England','Scotland','Northern Ireland'],k:0,why:'Cardiff（加的夫）是 Wales（威尔士）的首府。'},
{q:'What is the capital city of Northern Ireland?',a:['Dublin','London','Belfast','Edinburgh'],k:2,why:'Northern Ireland（北爱尔兰）的首府是 Belfast（贝尔法斯特）；Dublin 是爱尔兰共和国的首都。'},
{q:'Which city is the capital of both England and the United Kingdom?',a:['Manchester','Cardiff','Birmingham','London'],k:3,why:'London（伦敦）既是英格兰首府，也是英国首都。'},
{q:'Which pairing is correct?',a:['Scotland — Cardiff','Wales — Belfast','Northern Ireland — Belfast','England — Edinburgh'],k:2,why:'正确对应：Northern Ireland — Belfast。'}]},
{"id": "symbols", "title": "英国的旗帜与象征", "en": "Flags and National Symbols", "html": "<p>英国国旗通常叫 <b>Union Flag</b>，也常称 <b>Union Jack</b>。它结合了英格兰、苏格兰及代表爱尔兰的历史十字图案。</p><p>英格兰常见象征是<b>玫瑰 rose</b>；苏格兰是<b>蓟 thistle</b>；威尔士是<b>水仙 daffodil</b> 和<b>韭葱 leek</b>；北爱尔兰常用<b>三叶草 shamrock</b>。</p>", "questions": [{"q": "What is another name for the Union Flag?", "a": ["The Red Dragon", "The Union Jack", "The Royal Standard", "The White Ensign"], "k": 1, "why": "Union Flag 也常被称为 Union Jack。"}, {"q": "Which flower is associated with England?", "a": ["Rose", "Thistle", "Daffodil", "Shamrock"], "k": 0, "why": "玫瑰是英格兰的象征之一。"}, {"q": "Which plant is associated with Scotland?", "a": ["Leek", "Rose", "Thistle", "Oak"], "k": 2, "why": "蓟（thistle）是苏格兰象征。"}, {"q": "Which two plants are associated with Wales?", "a": ["Rose and shamrock", "Thistle and rose", "Oak and ivy", "Daffodil and leek"], "k": 3, "why": "威尔士常见象征为水仙和韭葱。"}]},
{"id": "patrons", "title": "守护圣人与节日", "en": "Patron Saints and Days", "html": "<p>英国四个组成部分各有传统守护圣人（<b>patron saint</b>）。英格兰：<b>St George</b>（4月23日）；苏格兰：<b>St Andrew</b>（11月30日）；威尔士：<b>St David</b>（3月1日）；北爱尔兰：<b>St Patrick</b>（3月17日）。</p><p>这些日期常出现在英国文化与传统相关的练习中。</p>", "questions": [{"q": "Who is the patron saint of Wales?", "a": ["St George", "St David", "St Andrew", "St Patrick"], "k": 1, "why": "威尔士守护圣人是 St David。"}, {"q": "When is St Patrick's Day?", "a": ["1 March", "23 April", "17 March", "30 November"], "k": 2, "why": "St Patrick's Day 是 3月17日。"}, {"q": "Which saint is associated with Scotland?", "a": ["St Andrew", "St David", "St Patrick", "St George"], "k": 0, "why": "苏格兰守护圣人是 St Andrew。"}, {"q": "When is St George's Day?", "a": ["30 November", "17 March", "1 March", "23 April"], "k": 3, "why": "英格兰的 St George's Day 是 4月23日。"}]},
{"id": "geography", "title": "英国的地理", "en": "UK Geography", "html": "<p>英国西临<b>Atlantic Ocean 大西洋</b>，东临<b>North Sea 北海</b>；英格兰与法国之间是<b>English Channel 英吉利海峡</b>。</p><p>英国最高山峰是苏格兰的 <b>Ben Nevis 本尼维斯山</b>。<b>River Thames 泰晤士河</b>流经伦敦。</p>", "questions": [{"q": "Which sea lies to the east of Great Britain?", "a": ["Irish Sea", "North Sea", "Mediterranean Sea", "Baltic Sea"], "k": 1, "why": "大不列颠东侧是 North Sea。"}, {"q": "Which channel separates England and France?", "a": ["Bristol Channel", "St George's Channel", "English Channel", "North Channel"], "k": 2, "why": "英格兰与法国之间是 English Channel。"}, {"q": "What is the highest mountain in the UK?", "a": ["Ben Nevis", "Snowdon", "Scafell Pike", "Helvellyn"], "k": 0, "why": "英国最高山峰是 Ben Nevis。"}, {"q": "Which river flows through London?", "a": ["River Severn", "River Clyde", "River Trent", "River Thames"], "k": 3, "why": "泰晤士河流经伦敦。"}]},
{"id": "parliament", "title": "议会如何运作", "en": "Parliament and Government", "html": "<p>英国议会（<b>Parliament</b>）由君主、<b>House of Commons 下议院</b>及<b>House of Lords 上议院</b>组成。</p><p>下议院议员称 <b>MPs</b>，代表各选区。英国首相（<b>Prime Minister</b>）领导政府。议会负责审议与制定法律，并监督政府。</p>", "questions": [{"q": "What does MP stand for?", "a": ["Member of Parliament", "Minister of Police", "Mayor of Parliament", "Member of Palace"], "k": 0, "why": "MP 是 Member of Parliament。"}, {"q": "Which house is made up of elected MPs?", "a": ["House of Lords", "House of Commons", "Supreme Court", "Cabinet Office"], "k": 1, "why": "经选举产生的 MPs 在 House of Commons。"}, {"q": "Who leads the UK government?", "a": ["The Speaker", "The Lord Mayor", "The Prime Minister", "The Archbishop"], "k": 2, "why": "首相领导英国政府。"}, {"q": "Which is part of the UK Parliament?", "a": ["The European Commission", "The High Court", "The Cabinet Office", "House of Lords"], "k": 3, "why": "上议院是英国议会的一部分。"}]},
{"id": "voting", "title": "选举与投票", "en": "Elections and Voting", "html": "<p>英国大选（<b>general election</b>）选出下议院议员。大选通常每隔数年举行，现行法律规定议会最长任期为五年。</p><p>英国下议院选举使用 <b>first past the post</b>：每个选区得票最多的候选人当选。选民通常需登记（<b>register to vote</b>），并符合相应资格。</p>", "questions": [{"q": "What do UK general elections choose?", "a": ["Members of the House of Commons", "Judges", "Members of the royal family", "Police officers"], "k": 0, "why": "大选选出下议院议员。"}, {"q": "What is the voting system for UK general elections?", "a": ["Proportional representation", "First past the post", "Lottery", "Appointment by the monarch"], "k": 1, "why": "下议院大选采用 first past the post。"}, {"q": "What should eligible voters do before voting?", "a": ["Join a political party", "Pay a voting fee", "Register to vote", "Apply for a passport"], "k": 2, "why": "符合资格的选民应先登记。"}, {"q": "What is the maximum normal length of a UK Parliament under current law?", "a": ["Two years", "Three years", "Four years", "Five years"], "k": 3, "why": "现行规定下议会任期最长五年。"}]},
{"id": "monarchy", "title": "君主与宪政", "en": "The Monarchy", "html": "<p>英国是<b>constitutional monarchy 君主立宪制</b>国家。君主是国家元首（<b>head of state</b>），政府由首相领导。</p><p>君主在议会制度中履行正式宪制职责，但日常政治决策由民选政府负责。英国没有一部单独成文的完整宪法，而是由法律、惯例及其他文件共同构成宪制框架。</p>", "questions": [{"q": "What type of monarchy does the UK have?", "a": ["Absolute monarchy", "Constitutional monarchy", "Elective monarchy", "No monarchy"], "k": 1, "why": "英国实行君主立宪制。"}, {"q": "Who is the UK's head of state?", "a": ["The Prime Minister", "The Speaker", "The monarch", "The Mayor of London"], "k": 2, "why": "英国君主是国家元首。"}, {"q": "Who normally makes day-to-day government decisions?", "a": ["The elected government", "The monarch alone", "The House of Lords alone", "The police"], "k": 0, "why": "日常施政由政府负责。"}, {"q": "Does the UK have one single complete written constitution?", "a": ["Yes, adopted in 1945", "Yes, adopted in 1707", "Yes, adopted in 1066", "No"], "k": 3, "why": "英国宪制来自多种法律、惯例和文件。"}]},
{"id": "history", "title": "英国历史的重要事件", "en": "Key Events in British History", "html": "<p><b>1066</b>：诺曼征服，威廉在黑斯廷斯战役获胜。<b>1215</b>：<b>Magna Carta 大宪章</b>签署。<b>1588</b>：英格兰击败西班牙无敌舰队。<b>1707</b>：英格兰与苏格兰的联合法案生效，形成大不列颠王国。</p><p>先记住“年份＋事件”的对应关系，再做英文题。</p>", "questions": [{"q": "What happened in 1066?", "a": ["The Norman Conquest", "The Great Fire of London", "The First World War", "The Act of Union"], "k": 0, "why": "1066年发生诺曼征服。"}, {"q": "What was agreed in 1215?", "a": ["The Bill of Rights", "Magna Carta", "The Act of Union", "The Reform Act"], "k": 1, "why": "1215年签署大宪章。"}, {"q": "Which fleet was defeated in 1588?", "a": ["The French navy", "The Dutch fleet", "The Spanish Armada", "The Viking fleet"], "k": 2, "why": "1588年击败西班牙无敌舰队。"}, {"q": "What happened in 1707?", "a": ["The Battle of Hastings", "Magna Carta was signed", "The Great Fire of London", "Union of England and Scotland"], "k": 3, "why": "1707年英格兰与苏格兰联合，形成大不列颠王国。"}]},
{"id": "culture", "title": "英国传统与公共生活", "en": "Traditions and Public Life", "html": "<p><b>Bonfire Night</b>（篝火之夜）在每年 <b>5 November</b>，纪念1605年火药阴谋事件。</p><p><b>Remembrance Day</b>（阵亡将士纪念日）是 <b>11 November</b>，人们常佩戴红色罂粟花（<b>red poppy</b>）表达纪念。</p><p>英国的 <b>National Health Service (NHS)</b> 是公共医疗服务体系，于1948年建立。</p>", "questions": [{"q": "When is Bonfire Night?", "a": ["1 January", "5 November", "11 November", "25 December"], "k": 1, "why": "Bonfire Night 是11月5日。"}, {"q": "What does the red poppy commonly symbolise?", "a": ["A royal wedding", "A general election", "Remembrance of those who died in war", "A harvest festival"], "k": 2, "why": "红色罂粟花常用于纪念战争死难者。"}, {"q": "What does NHS stand for?", "a": ["National Health Service", "National Housing Society", "Northern Health System", "New Hospital Scheme"], "k": 0, "why": "NHS 全称是 National Health Service。"}, {"q": "When was the NHS established?", "a": ["1066", "1707", "1918", "1948"], "k": 3, "why": "NHS 于1948年成立。"}]}
];
const storeKey='duanduan_progress_v2',oldKey='uk_litr_demo_v1';
function empty(){return {selected:'uk',records:{uk:{i:0,attempts:[]},capitals:{i:0,attempts:[]}}}}
let state=empty();
try{const v=JSON.parse(localStorage.getItem(storeKey));if(v&&v.records)state=v;else{const old=JSON.parse(localStorage.getItem(oldKey));if(old){state.records.uk.i=Math.max(0,Math.min(4,Number(old.i)||0));state.records.uk.attempts=Array.isArray(old.attempts)?old.attempts:[];}}}catch(e){}
function record(id){if(!state.records[id])state.records[id]={i:0,attempts:[]};return state.records[id]}
function save(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}}
let inQuiz=false,answeredThisQuestion=false;
function speak(t){if(!('speechSynthesis' in window)){alert('此浏览器不支持语音朗读。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.83;const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase()==='en-gb');if(v)u.voice=v;speechSynthesis.speak(u)}
function lesson(){return lessons.find(x=>x.id===state.selected)||lessons[0]}
function updateDashboard(){const finished=lessons.filter(l=>record(l.id).i>=l.questions.length).length,attempts=lessons.flatMap(l=>record(l.id).attempts),correct=attempts.filter(a=>a.correct).length;document.getElementById('completed').textContent=finished+'/'+lessons.length;document.getElementById('answered').textContent=attempts.length;document.getElementById('accuracy').textContent=attempts.length?Math.round(100*correct/attempts.length)+'%':'—';document.getElementById('overall').value=finished;document.getElementById('progress-note').textContent=finished===lessons.length?'十课均已完成，可以随时复习。':'已完成 '+finished+' 课，共 '+lessons.length+' 课。';const list=document.getElementById('lesson-list');list.replaceChildren();for(const l of lessons){const r=record(l.id),b=document.createElement('button');b.type='button';b.className='lesson'+(state.selected===l.id?' active':'');const left=document.createElement('span');const title=document.createElement('strong');title.textContent='第 '+(lessons.indexOf(l)+1)+' 课 · '+l.title;const sub=document.createElement('small');sub.textContent=l.en;left.append(title,sub);const right=document.createElement('span');right.textContent=r.i>=l.questions.length?'✓ 完成':r.i+'/'+l.questions.length;b.append(left,right);b.onclick=()=>{state.selected=l.id;inQuiz=false;save();render()};list.appendChild(b)}const history=document.getElementById('lesson-stats');history.replaceChildren();for(const l of lessons){const r=record(l.id),p=document.createElement('p');p.textContent='第 '+(lessons.indexOf(l)+1)+' 课：'+Math.min(r.i,l.questions.length)+'/'+l.questions.length+' 题完成 · '+r.attempts.filter(a=>a.correct).length+'/'+r.attempts.length+' 次答对';history.appendChild(p)}}
function render(){const l=lesson(),r=record(l.id);updateDashboard();document.getElementById('lesson-label').textContent='第 '+(lessons.indexOf(l)+1)+' 课 · '+l.en;document.getElementById('lesson-title').textContent=l.title;document.getElementById('lesson-explanation').innerHTML=l.html;document.getElementById('start').textContent=r.i>=l.questions.length?'重新复习本课 →':r.i?'继续练习 →':'开始练习 →';document.getElementById('lesson-card').classList.toggle('hidden',inQuiz);document.getElementById('quiz-card').classList.toggle('hidden',!inQuiz);if(inQuiz)renderQuestion()}
function renderQuestion(){const l=lesson(),r=record(l.id),done=r.i>=l.questions.length,choices=document.getElementById('choices');choices.replaceChildren();document.getElementById('feedback').textContent='';document.getElementById('next').classList.add('hidden');answeredThisQuestion=false;document.getElementById('counter').textContent=done?'本课完成':'第 '+(lessons.indexOf(l)+1)+' 课 · 问题 '+(r.i+1)+' / '+l.questions.length;document.getElementById('say-question').classList.toggle('hidden',done);if(done){document.getElementById('question').textContent='✓ 本课完成！';document.getElementById('feedback').textContent='你已完成本课 '+l.questions.length+' 道题。可以返回课程选择下一课。';return}const q=l.questions[r.i];document.getElementById('question').textContent=q.q;q.a.forEach((a,j)=>{const row=document.createElement('div');row.className='answer-row';const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+a;b.onclick=()=>{if(answeredThisQuestion)return;answeredThisQuestion=true;const ok=j===q.k;r.attempts.push({question:r.i,answer:j,correct:ok,time:new Date().toISOString()});save();choices.querySelectorAll('.choice').forEach((x,idx)=>{x.disabled=true;if(idx===q.k)x.classList.add('correct');else if(idx===j)x.classList.add('wrong')});document.getElementById('feedback').textContent=(ok?'✓ 答对了。':'✗ 这次没答对。')+q.why;document.getElementById('next').classList.remove('hidden');updateDashboard()};const audio=document.createElement('button');audio.type='button';audio.className='speak';audio.textContent='🔊';audio.setAttribute('aria-label','朗读 '+a);audio.onclick=()=>speak(a);row.append(b,audio);choices.appendChild(row)})}
document.getElementById('say-question').onclick=()=>{const l=lesson(),r=record(l.id);if(r.i<l.questions.length)speak(l.questions[r.i].q)};
document.getElementById('start').onclick=()=>{const l=lesson(),r=record(l.id);if(r.i>=l.questions.length){r.i=0;save()}inQuiz=true;render()};
document.getElementById('back').onclick=()=>{inQuiz=false;render()};
document.getElementById('next').onclick=()=>{if(!answeredThisQuestion)return;const r=record(lesson().id);r.i++;save();render()};
document.getElementById('reset-current').onclick=()=>{if(!confirm('重新开始本课？本课之前的答题记录也会清除。'))return;state.records[lesson().id]={i:0,attempts:[]};inQuiz=false;save();render()};
render();
</script></body></html>
